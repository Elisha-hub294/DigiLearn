name: Production CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check config does not leak secrets
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: dummy-api-key
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: example-project
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 123456789
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:abcdef
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: dummy-google-client-id
        run: node ./scripts/check-production-config.mjs

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint
